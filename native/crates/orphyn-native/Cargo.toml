[package]
name = "orphyn-native"
description = "Orphyn, the full-Rust desktop Jellyfin client (Dioxus Native / Blitz, no web engine)"
version = "2.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "orphyn-native"
path = "src/main.rs"

[dependencies]
tempfile.workspace = true
orphyn-core.workspace = true
orphyn-jellyfin.workspace = true
orphyn-player.workspace = true
dioxus.workspace = true
dioxus-native.workspace = true
blitz-dom.workspace = true
parley = "=0.12.0"
winit.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
log.workspace = true
base64 = "0.22"
sys-locale = "0.3"
# 1.5 migration (src/migration.rs): read the old webview's localStorage (WebView2 LevelDB on
# Windows, WebKit SQLite on macOS / Linux).
dirs.workspace = true
rusty-leveldb = "4"
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
