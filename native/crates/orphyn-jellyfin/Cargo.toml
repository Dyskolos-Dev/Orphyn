[package]
name = "orphyn-jellyfin"
description = "Jellyfin client of Orphyn native: auth, endpoints, image URLs and a query cache (dedup, stale-while-revalidate, invalidation)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio.workspace = true
thiserror.workspace = true
log.workspace = true
futures-util = "0.3"
percent-encoding = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }
