[package]
name = "orphyn-dioxus-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone project: not part of the repository's npm workspace.
[workspace]

[dependencies]
dioxus-native = "0.8.0-alpha.3"
dioxus = { version = "0.8.0-alpha.3", default-features = false, features = ["macro", "html", "signals", "hooks"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = "0.21"
tokio = { version = "1", features = ["time", "rt"] }
winit = "=0.31.0-beta.3"
libloading = "0.8"
wgpu = { version = "30", default-features = false }
anyrender = "0.14"
peniko = "0.6"
kurbo = "0.13"
blitz-dom = { version = "0.3.0-beta.4", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
