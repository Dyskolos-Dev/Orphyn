[package]
name = "orphyn-gpui-spike"
version = "0.0.1"
edition = "2021"

[dependencies]
gpui = "0.2.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libloading = "0.8"
rodio ={ version = "0.20", default-features = false, features = ["symphonia-all"] }

[profile.release]
opt-level = 3
lto = "thin"

# xattr 0.2.3 uses libc::ENOATTR, which current libc no longer exports on Linux (ENODATA is the same errno).
[patch.crates-io]
xattr = { path = "vendor/xattr" }
