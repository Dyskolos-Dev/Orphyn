[package]
name = "orphyn"
version = "1.5.0"
description = "Orphyn - a desktop Jellyfin client for music, movies and series"
authors = ["Dyskolos_"]
license = "UNLICENSED"
repository = "https://github.com/Dyskolos-Dev/Orphyn"
edition = "2021"
rust-version = "1.85"

[lib]
name = "orphyn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-os = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
thiserror = "2"
tracing = "0.1"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "7"
# Cast (Chromecast, UPnP/DLNA, AirPlay discovery)
mdns-sd = "0.21"
rust_cast = "0.21"
quick-xml = { version = "0.42", features = ["serialize"] }
# Discord Rich Presence
discord-rich-presence = "1"
# OS media controls (SMTC, Now Playing, MPRIS)
souvlaki = "0.9"
# Native window materials
window-vibrancy = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
