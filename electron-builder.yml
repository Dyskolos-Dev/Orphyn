appId: app.jellyra.desktop
productName: Jellyra
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - resources/**
win:
  target:
    - nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.entertainment
  icon: build/icon.png
linux:
  target:
    - AppImage
    - deb
  category: AudioVideo
  icon: build/icon.png
