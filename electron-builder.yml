appId: app.lumen.desktop
productName: Lumen
copyright: Copyright © Dyskolos_
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - resources/**
# Auto-update feed: electron-updater reads latest*.yml from the GitHub release.
publish:
  provider: github
  owner: Dyskolos-Dev
  repo: Lumen
  releaseType: release
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # Dark navy installer artwork, generated by build/scripts/generate-installer-assets.mjs.
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  include: build/installer.nsh
  shortcutName: Lumen
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: Lumen-Setup-${version}.${ext}
mac:
  target:
    # zip is what latest-mac.yml points the updater at; dmg is the installer users download.
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.entertainment
  icon: build/icon.png
dmg:
  title: Lumen
  icon: build/icon.png
  background: build/dmg-background.png # build/dmg-background@2x.png is picked up for Retina
  iconSize: 96
  window:
    width: 660
    height: 400
  contents:
    - x: 180
      y: 200
      type: file
    - x: 480
      y: 200
      type: link
      path: /Applications
linux:
  target:
    - AppImage
    - deb
  category: AudioVideo
  icon: build/icon.png
  maintainer: Dyskolos_ <noreply@dyskolos.fr>
  synopsis: Desktop Jellyfin client for music, movies and series
  desktop:
    entry:
      Name: Lumen
      Comment: Desktop Jellyfin client
      Categories: AudioVideo;Video;Audio;Player;
      StartupWMClass: Lumen
