# Deliberately still the pre-rename id: the NSIS upgrade (registry key) and the auto-updater match
# installs by appId, so changing it would leave 1.0.x users with a second app and no updates.
appId: app.lumen.desktop
productName: Orphyn
copyright: Copyright © Dyskolos_
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - resources/**
# Auto-update feed: electron-updater reads latest*.yml from the GitHub release.
publish:
  provider: github
  owner: Dyskolos-Dev
  repo: Orphyn
  releaseType: release
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  # The install folder is chosen on the custom Options page (build/installer.nsh).
  allowToChangeInstallationDirectory: false
  perMachine: false
  # Fully custom pages (build/installer.nsh) on the backgrounds generated by
  # build/scripts/generate-installer-assets.mjs.
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  include: build/installer.nsh
  shortcutName: Orphyn
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: false
  deleteAppDataOnUninstall: false
  artifactName: Orphyn-Setup-${version}.${ext}
mac:
  target:
    # zip is what latest-mac.yml points the updater at; dmg is the installer users download.
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.entertainment
  icon: build/icon.png
dmg:
  title: Orphyn
  icon: build/icon.png
  background: build/dmg-background.png # build/dmg-background@2x.png is picked up for Retina
  iconSize: 96
  window:
    width: 660
    height: 400
  contents:
    - x: 180
      y: 200
      type: file
    - x: 480
      y: 200
      type: link
      path: /Applications
linux:
  target:
    - AppImage
    - deb
  category: AudioVideo
  icon: build/icon.png
  maintainer: Dyskolos_ <noreply@dyskolos.fr>
  synopsis: Desktop Jellyfin client for music, movies and series
  desktop:
    entry:
      Name: Orphyn
      Comment: Desktop Jellyfin client
      Categories: AudioVideo;Video;Audio;Player;
      StartupWMClass: Orphyn
