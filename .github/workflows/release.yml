# Release: on a v* tag, build installers on each operating system and publish ONE GitHub release
# holding every installer plus latest.yml / latest-mac.yml / latest-linux.yml and the blockmaps that
# the in-app updater (electron-updater) reads. The release is published, not a draft: a draft is
# invisible to installed clients.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the Windows installer art
        # build/installer-art/ is generated (and git-ignored): the custom NSIS pages include it.
        if: runner.os == 'Windows'
        run: |
          npx playwright install chromium
          npm run installer-art

      - name: Build and publish
        # Each OS job uploads its own files to the same release (electron-builder creates it once and
        # reuses it), so one tag gives one release with everything attached.
        # Signing is optional: set the secrets below and remove CSC_IDENTITY_AUTO_DISCOVERY.
        #   Windows: CSC_LINK (base64 or URL of the .pfx) and CSC_KEY_PASSWORD
        #   macOS:   CSC_LINK (Developer ID .p12), CSC_KEY_PASSWORD, APPLE_ID,
        #            APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (notarization)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build && npx electron-builder --publish always
